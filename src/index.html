<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>नमस्ते Baddie</title>
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>

<!-- Decorative background word -->
<div class="bg-deco">बस।</div>

<div class="nb">

  <!-- ══ S1: SPLASH ══ -->
  <div class="sc on" id="s1">
    <div class="splash-wrap">
      <div class="splash-namaste">नमस्ते</div>
      <div class="splash-baddie">Baddie</div>
      <div class="splash-rule"></div>
      <p class="splash-tagline">Pick your mood · Get one move · Start now</p>
      <div style="animation: fadeUp 0.6s 0.55s both; display: inline-block;">
        <button class="btn btn-p" onclick="go('s2')">Start &rarr;</button>
      </div>
      <p class="splash-hint" id="splash-hint"></p>
    </div>
  </div>

  <!-- ══ S2: MOOD SELECTION ══ -->
  <div class="sc" id="s2">
    <div class="center">
      <span class="label">Step 1 of 3</span>
      <h2 class="h2">How are you feeling right now?</h2>
      <p class="sub">Be honest. No one's judging.</p>

      <div class="mood-grid">
        <button class="card m-lazy" onclick="pickMood('lazy')">
          <div class="card-num">01</div>
          <div class="card-title">I feel lazy.</div>
          <div class="card-sub">Energy low.<br>Resistance high.</div>
        </button>
        <button class="card m-over" onclick="pickMood('over')">
          <div class="card-num">02</div>
          <div class="card-title">I'm overwhelmed.</div>
          <div class="card-sub">Too many<br>open loops.</div>
        </button>
        <button class="card m-cant" onclick="pickMood('cant')">
          <div class="card-num">03</div>
          <div class="card-title">I can't start.</div>
          <div class="card-sub">Stuck at<br>the starting line.</div>
        </button>
        <button class="card m-bore" onclick="pickMood('bore')">
          <div class="card-num">04</div>
          <div class="card-title">I'm bored.</div>
          <div class="card-sub">Mind wants<br>stimulation.</div>
        </button>
      </div>

      <button class="btn back-btn" onclick="go('s1')">&larr; Back</button>
    </div>
  </div>

  <!-- ══ S3: ACTION SETUP ══ -->
  <div class="sc" id="s3">
    <div class="center">
      <span class="label">Step 2 of 3</span>

      <!-- Mood stripe -->
      <div class="mood-stripe" id="mood-stripe">
        <span class="tag" id="mood-tag"></span>
        <span class="mood-tone" id="mood-tone"></span>
      </div>

      <h2 class="h2">What are you about to do?</h2>
      <p class="sub" id="action-guide">One task only.</p>

      <input
        class="nb-in"
        id="task-input"
        type="text"
        placeholder="Write one specific thing..."
        maxlength="80"
        autocomplete="off"
      >

      <span class="label">For how long?</span>
      <div class="topts" id="timer-opts"></div>

      <hr class="divider">

      <div class="brow">
        <button class="btn btn-p" onclick="startSession()">Start session &rarr;</button>
        <button class="btn back-btn" onclick="go('s2')">&larr; Change mood</button>
      </div>
    </div>
  </div>

  <!-- ══ S4: TIMER ══ -->
  <div class="sc" id="s4">
    <div class="timer-screen-inner">
      <span class="label" style="text-align:center; display:block;">In session</span>
      <p class="session-task-name" id="session-task"></p>
      <div style="margin-bottom:4px;">
        <span class="tag" id="session-mood-tag"></span>
      </div>

      <div class="tmr-wrap" id="tmr-wrap">
        <svg viewBox="0 0 220 220" width="210" height="210" xmlns="http://www.w3.org/2000/svg">
          <!-- track -->
          <circle cx="110" cy="110" r="96"
            fill="none"
            stroke="rgba(245,237,216,0.07)"
            stroke-width="8"/>
          <!-- progress arc -->
          <circle id="arc"
            cx="110" cy="110" r="96"
            fill="none"
            stroke="var(--saffron)"
            stroke-width="8"
            stroke-linecap="round"
            stroke-dasharray="603"
            stroke-dashoffset="0"
            transform="rotate(-90 110 110)"/>
        </svg>
        <div class="tmr-n" id="td">00:00</div>
      </div>

      <div class="brow" style="justify-content:center; margin-bottom:1.25rem;">
        <button class="btn" id="pause-btn" onclick="togglePause()">Pause</button>
        <button class="btn btn-d" onclick="showQuit()">Quit early</button>
      </div>

      <div class="qbox" id="quit-confirm">
        <p style="font-family:var(--head); font-size:15px; font-weight:700; margin-bottom:6px;">
          Leaving early?
        </p>
        <p style="font-size:13px; color:var(--cream2); font-weight:300; margin-bottom:1.1rem; line-height:1.6;">
          The task will not finish itself.
        </p>
        <div class="brow">
          <button class="btn" onclick="hideQuit()">Keep going</button>
          <button class="btn btn-d" onclick="confirmQuit()">Yes, quit</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ══ S5: COMPLETION ══ -->
  <div class="sc" id="s5">
    <div class="center-sm" style="padding-top:2rem;">
      <div id="finish-icon"></div>
      <h2 class="h2" id="finish-title" style="text-align:center; margin-bottom:8px;"></h2>
      <p class="sub" id="finish-sub" style="text-align:center;"></p>

      <div class="sbox">
        <p style="font-size:10px; font-family:var(--head); font-weight:700; letter-spacing:0.12em; text-transform:uppercase; color:var(--cream2); margin-bottom:8px;">
          Task completed
        </p>
        <p id="finish-task" style="font-size:16px; font-weight:500; word-break:break-word; line-height:1.4;"></p>
        <p id="finish-meta" style="font-size:12px; color:var(--cream2); margin-top:6px; font-family:var(--head); font-weight:600; letter-spacing:0.05em;"></p>
      </div>

      <p id="finish-streak" style="margin-bottom:1.75rem;"></p>

      <div class="brow" style="justify-content:center;">
        <button class="btn btn-p" onclick="go('s2')">One more &rarr;</button>
        <button class="btn" onclick="go('s1')">Done for now</button>
      </div>
    </div>
  </div>

</div><!-- .nb -->

<script src="js/moods.js"></script>
<script src="js/storage.js"></script>
<script src="js/timer.js"></script>
<script src="js/app.js"></script>
</body>
</html>
